<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="weatherapi.css" />
</head>


 <body>
  <div class="app">
    <header class="header">
      <h1>Weather App</h1>
      <div class="header-controls">
        <button id="cBtn" class="unit-btn active">°C</button>
        <button id="fBtn" class="unit-btn">°F</button>
        <button id="themeToggle" class="theme-btn">🌙</button>
      </div>
    </header>
    
    <section class="search-section">
      <p class="subtitle">Get current weather</p>
      <div class="search-bar">
        <input type="text" id="cityInput" placeholder="Enter city name" />
        <button id="searchBtn">Search</button>
      </div>
      <p id="loading" class="loading hidden">Loading...</p>
      <p id="error" class="error"></p>
    </section>
    
    <section id="currentWeather" class="current-weather"></section>
    
    <section class="forecast-section">
      <p id="forecastTitle" class="subtitle hidden">5-day forecast</p>
      <div id="forecast" class="forecast-grid"></div>
    </section> 
    
    <footer class="footer">
      <p>Powered by OpenWeather API</p>
    </footer>
  </div>

  <script src="weatherapi.js"></script>
</body>
</html>
